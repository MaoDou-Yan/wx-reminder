name: 微信定时提醒
on:
  workflow_dispatch: # 支持手动点按钮测试
  schedule:
    # cron: 分 时 日 月 周 【UTC时间】
    # 例子：UTC 0 2 * * * → 北京时间 10:00
    - cron: '0 2 * * *'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run send script
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          WX_OPENID: ${{ secrets.WX_OPENID }}
          WX_TEMPLATE_ID: ${{ secrets.WX_TEMPLATE_ID }}
        run: python send_wx.py