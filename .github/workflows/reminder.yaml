name: 微信定时提醒
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'    # 北京时间 09:00
    - cron: '0 4 * * *'    # 北京时间 12:00
    - cron: '0 6 * * *'    # 北京时间 14:00
    - cron: '0 8 * * *'    # 北京时间 14:00
    - cron: '0 9 * * *'    # 北京时间 17:00
    - cron: '0 10 * * *'   # 北京时间 18:00

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run send script
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          WX_OPENID: ${{ secrets.WX_OPENID }}
          WX_TEMPLATE_ID: ${{ secrets.WX_TEMPLATE_ID }}
          JUHE_WEATHER_KEY: ${{ secrets.JUHE_WEATHER_KEY }}
          JUHE_HORO_KEY: ${{ secrets.JUHE_HORO_KEY }}
        run: python send_wx.py
